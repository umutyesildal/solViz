codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"
  status:
    project:
      default:
        target: 70%
        threshold: 5%
    patch:
      default:
        target: 60%
        threshold: 10%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: no
  branches: null

ignore:
  - "backend/tests/**/*"
  - "backend/alembic/**/*"
  - "frontend/__tests__/**/*"
  - "frontend/jest.config.js"
  - "frontend/jest.setup.js"
